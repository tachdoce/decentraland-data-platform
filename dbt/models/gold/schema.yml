version: 2

models:
  - name: dim_nft_contracts
    description: >
      NFT contract dimension: curated contracts restricted to ERC-721/1155.
      One row per (chain_id, contract_address), keyed by sk_contract.
    columns:
      - name: sk_contract
        data_tests:
          - not_null
          - unique
      - name: chain_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 137]
                quote: false
      - name: contract_address
        data_tests:
          - not_null
      - name: dcl_contract
        data_tests:
          - not_null
      - name: erc_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [721, 1155]
                quote: false

  - name: fct_sales
    description: >
      Sales fact: one row per token sold across the Ethereum marketplaces,
      priced in USD with the sale-day quote. Grain: (chain_id,
      transaction_hash, log_index, sk_contract, token_id). INNER JOINs to
      dim_currency, token_prices and dim_nft_contracts are intentional:
      only sales with a curated payment token and a price for the day are
      published. Starts 2019-01-01, the first day token_prices covers;
      2018 sales stay silver-only. Incremental, partitioned by dt; runs
      advance at most sales_incremental_days (default 10) past max dt.
    columns:
      - name: transaction_hash
        data_tests:
          - not_null
      - name: log_index
        data_tests:
          - not_null
      - name: block_timestamp
        data_tests:
          - not_null
      - name: buyer
        data_tests:
          - not_null
      - name: seller
        data_tests:
          - not_null
      - name: sk_contract
        data_tests:
          - not_null
      - name: token_id
        data_tests:
          - not_null
      - name: quantity
        data_tests:
          - not_null
      - name: currency_symbol
        data_tests:
          - not_null
      - name: total_amount
        data_tests:
          - not_null
      - name: royalty_amount
        data_tests:
          - not_null
      - name: usd_total_amount
        data_tests:
          - not_null
      - name: usd_royalty_amount
        data_tests:
          - not_null
      - name: chain_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1]
                quote: false
      - name: marketplace
        data_tests:
          - not_null
      - name: dt
        data_tests:
          - not_null

  - name: fct_monthly_nft_prices
    description: >
      Monthly NFT aggregate per contract: USD median unit price
      (usd_total_amount / quantity) plus volume. Grain: (month,
      sk_contract). On-demand only: mandatory 'month' var (YYYY-MM)
      names the single partition each run replaces; tag:manual keeps it
      out of every automatic run-dbt selection, so it runs only via
      local dbt. Tests are bounded to the partition just loaded.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - month
              - sk_contract
          config:
            where: "month = '{{ var(\"month\", \"\") }}'"
      - dbt_utils.expression_is_true:
          name: fct_monthly_nft_prices_median_non_negative
          arguments:
            expression: "usd_median_unit_price >= 0"
          config:
            where: "month = '{{ var(\"month\", \"\") }}'"
      - dbt_utils.expression_is_true:
          name: fct_monthly_nft_prices_quantity_positive
          arguments:
            expression: "nft_quantity > 0"
          config:
            where: "month = '{{ var(\"month\", \"\") }}'"
    columns:
      - name: sk_contract
        data_tests:
          - not_null:
              config:
                where: "month = '{{ var(\"month\", \"\") }}'"
      - name: month
        data_tests:
          - not_null:
              config:
                where: "month = '{{ var(\"month\", \"\") }}'"
      - name: usd_median_unit_price
        data_tests:
          - not_null:
              config:
                where: "month = '{{ var(\"month\", \"\") }}'"

  - name: dim_currency
    description: >
      Payment-currency dimension. No surrogate key: facts join prices by
      currency_symbol, since one currency can live on N chains with the
      same quote. One row per (chain_id, contract_address).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - chain_id
              - contract_address
    columns:
      - name: chain_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 137]
                quote: false
      - name: contract_address
        data_tests:
          - not_null
      - name: name
        data_tests:
          - not_null
      - name: currency_symbol
        data_tests:
          - not_null
      - name: decimals
        data_tests:
          - not_null
      - name: fetch_price
        data_tests:
          - not_null

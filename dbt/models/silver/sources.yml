version: 2

sources:
  - name: bronze
    description: Raw layer, written by the ingestion Lambdas. Glue database `bronze`.
    database: awsdatacatalog
    schema: bronze
    tables:
      - name: dcl_contracts
        description: >
          Daily full snapshot of the official Decentraland contract registry
          (contracts.decentraland.org/addresses.json). Partitioned by dt;
          partitions registered explicitly by the Lambda.
        columns:
          - name: chain_id
            description: EIP-155 numeric chain id (1=ethereum, 137=polygon).
          - name: contract_address
            description: Contract address, lowercase.
          - name: contract_name
            description: Contract name as published in the registry.
          - name: dt
            description: Snapshot date partition (YYYY-MM-DD).

      - name: ethereum_logs
        description: >
          Raw Ethereum mainnet logs for curated contracts (and every log of
          the transactions touching them), extracted daily from BigQuery.
          Append-only timestamped parquets; partitioned by dt, partitions
          registered explicitly by the Lambda.
        columns:
          - name: transaction_hash
            description: Transaction hash.
          - name: log_index
            description: Log position within the transaction's block.
          - name: block_timestamp
            description: Block timestamp (UTC).
          - name: address
            description: Address of the contract that emitted the log, lowercase.
          - name: topics
            description: Indexed event topics; topics[1] is the event signature.
          - name: data
            description: ABI-encoded non-indexed event payload (hex string).
          - name: extracted_at
            description: Extraction timestamp (append-only dedup key).
          - name: dt
            description: Block date partition (YYYY-MM-DD).

      - name: polygon_logs
        description: >
          Raw Polygon mainnet logs, same contract and schema as
          ethereum_logs. Partitioned by dt; partitions registered
          explicitly by the Lambda.
        columns:
          - name: transaction_hash
            description: Transaction hash.
          - name: log_index
            description: Log position within the transaction's block.
          - name: block_timestamp
            description: Block timestamp (UTC).
          - name: address
            description: Address of the contract that emitted the log, lowercase.
          - name: topics
            description: Indexed event topics; topics[1] is the event signature.
          - name: data
            description: ABI-encoded non-indexed event payload (hex string).
          - name: extracted_at
            description: Extraction timestamp (append-only dedup key).
          - name: dt
            description: Block date partition (YYYY-MM-DD).

      - name: contracts
        description: >
          Hand-curated contract list ingested from reference/ via
          landing/ -> Lambda -> bronze snapshot. Partitions registered
          explicitly by the Lambda.
        columns:
          - name: chain_id
            description: EIP-155 numeric chain id (1=ethereum, 137=polygon).
          - name: contract_address
            description: Contract address, lowercase.
          - name: contract_name
            description: Curated contract name.
          - name: first_mint_dt
            description: Date of the contract's first mint.
          - name: extract_from_dt
            description: Start date for the on-chain backfill of this contract.
          - name: dcl_contract
            description: True when the contract belongs to Decentraland itself.
          - name: erc_type
            description: >
              ERC token standard: 20, 721 or 1155. 0 = not yet classified
              (likely marketplace or similar); -1 = excluded from processing.
          - name: dt
            description: Snapshot date partition (YYYY-MM-DD).

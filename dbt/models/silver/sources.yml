version: 2

sources:
  - name: bronze
    description: Raw layer, written by the ingestion Lambdas. Glue database `bronze`.
    database: awsdatacatalog
    schema: bronze
    tables:
      - name: dcl_contracts
        description: >
          Daily full snapshot of the official Decentraland contract registry
          (contracts.decentraland.org/addresses.json). Partitioned by dt;
          partitions registered explicitly by the Lambda.
        columns:
          - name: chain_id
            description: EIP-155 numeric chain id (1=ethereum, 137=polygon).
          - name: contract_address
            description: Contract address, lowercase.
          - name: contract_name
            description: Contract name as published in the registry.
          - name: dt
            description: Snapshot date partition (YYYY-MM-DD).

      - name: ethereum_logs
        description: >
          Raw Ethereum mainnet logs for curated contracts (and every log of
          the transactions touching them), extracted daily from BigQuery.
          Append-only timestamped parquets; partitioned by dt, partitions
          registered explicitly by the Lambda.
        columns:
          - name: transaction_hash
            description: Transaction hash.
          - name: log_index
            description: Log position within the transaction's block.
          - name: block_timestamp
            description: Block timestamp (UTC).
          - name: address
            description: Address of the contract that emitted the log, lowercase.
          - name: topics
            description: Indexed event topics; topics[1] is the event signature.
          - name: data
            description: ABI-encoded non-indexed event payload (hex string).
          - name: extracted_at
            description: Extraction timestamp (append-only dedup key).
          - name: dt
            description: Block date partition (YYYY-MM-DD).

      - name: polygon_logs
        description: >
          Raw Polygon mainnet logs, same contract and schema as
          ethereum_logs. Partitioned by dt; partitions registered
          explicitly by the Lambda.
        columns:
          - name: transaction_hash
            description: Transaction hash.
          - name: log_index
            description: Log position within the transaction's block.
          - name: block_timestamp
            description: Block timestamp (UTC).
          - name: address
            description: Address of the contract that emitted the log, lowercase.
          - name: topics
            description: Indexed event topics; topics[1] is the event signature.
          - name: data
            description: ABI-encoded non-indexed event payload (hex string).
          - name: extracted_at
            description: Extraction timestamp (append-only dedup key).
          - name: dt
            description: Block date partition (YYYY-MM-DD).

      - name: contracts
        description: >
          Hand-curated contract list ingested from reference/ via
          landing/ -> Lambda -> bronze snapshot. Partitions registered
          explicitly by the Lambda.
        columns:
          - name: chain_id
            description: EIP-155 numeric chain id (1=ethereum, 137=polygon).
          - name: contract_address
            description: Contract address, lowercase.
          - name: contract_name
            description: Curated contract name.
          - name: first_mint_dt
            description: Date of the contract's first mint.
          - name: extract_from_dt
            description: Start date for the on-chain backfill of this contract.
          - name: dcl_contract
            description: True when the contract belongs to Decentraland itself.
          - name: erc_type
            description: >
              ERC token standard: 20, 721 or 1155. 0 = not yet classified
              (likely marketplace or similar); -1 = excluded from processing.
          - name: dt
            description: Snapshot date partition (YYYY-MM-DD).

      - name: erc20_tokens
        description: >
          Hand-curated ERC-20 payment-token list ingested from reference/
          via landing/ -> Lambda -> bronze snapshot. Partitions registered
          explicitly by the Lambda.
        columns:
          - name: chain_id
            description: EIP-155 numeric chain id (1=ethereum, 137=polygon).
          - name: contract_address
            description: >
              Token contract address, lowercase. The zero address is the
              native-ETH placeholder used by marketplace trades paid in ETH.
          - name: name
            description: Human-readable token name.
          - name: fsym
            description: >
              Price-source ticker. Informative only, NOT unique — GALA v1
              and v2 share it; joins always use (chain_id, contract_address).
          - name: decimals
            description: >
              ERC-20 decimals for raw-amount conversion
              (amount = raw / 10^decimals). Not always 18: USDC/USDT use 6;
              GALA, CUBE and GMT use 8.
          - name: fetch_price
            description: >
              TRUE when the prices Lambda must fetch quotes for this token;
              FALSE excludes it from price extraction.
          - name: dt
            description: Snapshot date partition (YYYY-MM-DD).

      - name: token_prices
        description: >
          Daily USD prices from DefiLlama (contract-address lookup) for the
          curated payment tokens, extracted by extract-token-prices.
          Append-only timestamped parquets; duplicates resolved downstream
          by latest extracted_at. Partitioned by month, partitions
          registered explicitly by the Lambda.
        columns:
          - name: chain_id
            description: EIP-155 numeric chain id (1=ethereum).
          - name: contract_address
            description: >
              Token contract, lowercase. The zero address is the native-ETH
              placeholder (priced via coingecko:ethereum).
          - name: dt
            description: Grid day of the quote (00:00 UTC), from the requested grid.
          - name: price_usd
            description: DefiLlama USD price for the grid day.
          - name: price_ts
            description: Actual returned sample timestamp (drift audit).
          - name: confidence
            description: DefiLlama confidence score for the coin.
          - name: extracted_at
            description: Extraction timestamp (append-only dedup key).
          - name: month
            description: Month partition (YYYY-MM).

  - name: staging
    description: Decoded layer, written by the decode Lambdas. Glue database `staging`.
    database: awsdatacatalog
    schema: staging
    tables:
      - name: ethereum_nft_transfers
        description: >
          ERC-721/1155 Transfer events decoded from bronze.ethereum_logs by
          the decode-nft-transfers Lambda. One row per transferred token
          position (TransferBatch flattened). Partitioned by dt; the Lambda
          overwrites touched partitions, so re-decoding never duplicates —
          only double bronze extraction can.
        columns:
          - name: transaction_hash
            description: Transaction hash.
          - name: log_index
            description: Log position within the transaction's block.
          - name: block_timestamp
            description: Block timestamp (UTC).
          - name: contract_address
            description: Address of the NFT contract, lowercase.
          - name: erc_type
            description: ERC token standard of the contract (721 or 1155).
          - name: token_id
            description: Token id as a decimal string (LAND ids exceed 64 bits).
          - name: quantity
            description: Transferred amount; always 1 for ERC-721.
          - name: from_address
            description: Sender address, lowercase (zero address = mint).
          - name: to_address
            description: Recipient address, lowercase (zero address = burn).
          - name: bronze_extracted_at
            description: Extraction timestamp inherited from bronze.
          - name: decoded_at
            description: Timestamp of the decode Lambda run.
          - name: dt
            description: Block date partition (YYYY-MM-DD).

      - name: ethereum_currency_transfers
        description: >
          ERC-20 Transfer events decoded from bronze.ethereum_logs by the
          decode-ethereum-currency-transfers Lambda. Append-only timestamped
          parquets; downstream dedups by latest decoded_at. Partitioned by dt.
        columns:
          - name: transaction_hash
            description: Transaction hash.
          - name: log_index
            description: Log position within the transaction's block.
          - name: block_timestamp
            description: Block timestamp (UTC).
          - name: token_address
            description: ERC-20 token contract, lowercase.
          - name: from_address
            description: Sender address, lowercase.
          - name: to_address
            description: Recipient address, lowercase.
          - name: amount_raw
            description: Raw token amount, decimal(38,0).
          - name: bronze_extracted_at
            description: Extraction timestamp inherited from bronze.
          - name: decoded_at
            description: Timestamp of the decode Lambda run.
          - name: dt
            description: Block date partition (YYYY-MM-DD).

      - name: ethereum_legacy_marketplace_auctions
        description: >
          LegacyMarketplace auction events (LAND-only marketplace,
          2018-08-30 to 2020-03-07). Append-only; dedup downstream by
          latest decoded_at. Partitioned by dt.
        columns:
          - name: transaction_hash
            description: Transaction hash.
          - name: log_index
            description: Log position within the transaction's block.
          - name: block_timestamp
            description: Block timestamp (UTC).
          - name: event_name
            description: AuctionCreated / AuctionSuccessful / AuctionCancelled.
          - name: auction_id
            description: Auction id.
          - name: asset_id
            description: LAND token id as a decimal string.
          - name: seller
            description: Seller address, lowercase.
          - name: winner
            description: Auction winner (the buyer), lowercase.
          - name: total_price
            description: MANA raw price, decimal(38,0).
          - name: expires_at
            description: Auction expiry (decoded from unix milliseconds).
          - name: bronze_extracted_at
            description: Extraction timestamp inherited from bronze.
          - name: decoded_at
            description: Timestamp of the decode Lambda run.
          - name: dt
            description: Block date partition (YYYY-MM-DD).

      - name: ethereum_marketplace_v2_orders
        description: >
          Marketplace v2 order events (multi-collection, MANA-only).
          Append-only; dedup downstream by latest decoded_at.
          Partitioned by dt.
        columns:
          - name: transaction_hash
            description: Transaction hash.
          - name: log_index
            description: Log position within the transaction's block.
          - name: block_timestamp
            description: Block timestamp (UTC).
          - name: event_name
            description: OrderCreated / OrderSuccessful / OrderCancelled.
          - name: order_id
            description: Order id.
          - name: asset_id
            description: Token id as a decimal string.
          - name: contract_address
            description: NFT contract sold, lowercase.
          - name: seller
            description: Seller address, lowercase.
          - name: buyer
            description: Buyer address, lowercase.
          - name: total_price
            description: MANA raw price, decimal(38,0).
          - name: expires_at
            description: Order expiry (decoded from unix milliseconds).
          - name: bronze_extracted_at
            description: Extraction timestamp inherited from bronze.
          - name: decoded_at
            description: Timestamp of the decode Lambda run.
          - name: dt
            description: Block date partition (YYYY-MM-DD).

      - name: ethereum_wyvern_sales
        description: >
          OpenSea Wyvern OrdersMatched events (2018-11-06 to 2022-08-01).
          Append-only; dedup downstream by latest decoded_at.
          Partitioned by dt.
        columns:
          - name: transaction_hash
            description: Transaction hash.
          - name: log_index
            description: Log position within the transaction's block.
          - name: block_timestamp
            description: Block timestamp (UTC).
          - name: wyvern_address
            description: Wyvern exchange contract that emitted the event, lowercase.
          - name: buy_hash
            description: Zero hash when the match came from a listing (maker sells).
          - name: sell_hash
            description: Sell-side order hash.
          - name: maker
            description: Maker address, lowercase.
          - name: taker
            description: Taker address, lowercase.
          - name: price
            description: Raw price in the payment token, decimal(38,0).
          - name: metadata
            description: Order metadata word.
          - name: bronze_extracted_at
            description: Extraction timestamp inherited from bronze.
          - name: decoded_at
            description: Timestamp of the decode Lambda run.
          - name: dt
            description: Block date partition (YYYY-MM-DD).

      - name: ethereum_seaport_sales
        description: >
          OpenSea Seaport OrderFulfilled events (from 2022-06-03), one row
          per order with NFT and payment legs as parallel arrays.
          Append-only; dedup downstream by latest decoded_at.
          Partitioned by dt.
        columns:
          - name: transaction_hash
            description: Transaction hash.
          - name: log_index
            description: Log position within the transaction's block.
          - name: block_timestamp
            description: Block timestamp (UTC).
          - name: seaport_address
            description: Seaport contract that emitted the event, lowercase.
          - name: order_hash
            description: Fulfilled order hash.
          - name: offerer
            description: Order offerer, lowercase.
          - name: recipient
            description: Order recipient, lowercase.
          - name: order_side
            description: listing or bid.
          - name: buyer
            description: Buyer address, lowercase.
          - name: seller
            description: Seller address, lowercase; NULL when not identifiable.
          - name: nft_contract_addresses
            description: Array of NFT contracts, parallel to the other nft_* arrays.
          - name: nft_token_ids
            description: Array of decimal-string token ids.
          - name: nft_quantities
            description: Array of decimal(38,0).
          - name: nft_froms
            description: Array of sender addresses.
          - name: nft_tos
            description: Array of recipient addresses.
          - name: payment_currencies
            description: Array of payment token addresses; zero address = native ETH.
          - name: payment_amounts
            description: Array of decimal(38,0).
          - name: payment_recipients
            description: Array of payment recipients.
          - name: bronze_extracted_at
            description: Extraction timestamp inherited from bronze.
          - name: decoded_at
            description: Timestamp of the decode Lambda run.
          - name: dt
            description: Block date partition (YYYY-MM-DD).

      - name: ethereum_marketplace_trades
        description: >
          Decentraland off-chain marketplace Traded events (from
          2024-12-21), one row per trade with NFT and payment legs as
          parallel arrays. Append-only; dedup downstream by latest
          decoded_at. Partitioned by dt.
        columns:
          - name: transaction_hash
            description: Transaction hash.
          - name: log_index
            description: Log position within the transaction's block.
          - name: block_timestamp
            description: Block timestamp (UTC).
          - name: marketplace_address
            description: Marketplace contract that emitted the event, lowercase.
          - name: trade_id
            description: Trade id.
          - name: caller
            description: Transaction caller, lowercase.
          - name: signer
            description: Off-chain order signer, lowercase.
          - name: order_side
            description: Trade side.
          - name: buyer
            description: Buyer address, lowercase.
          - name: seller
            description: Seller address, lowercase.
          - name: nft_contract_addresses
            description: Array of NFT contracts, parallel to the other nft_* arrays.
          - name: nft_token_ids
            description: Array of decimal-string token ids.
          - name: nft_asset_types
            description: Array of asset type codes, bigint.
          - name: nft_beneficiaries
            description: Array of NFT beneficiary addresses.
          - name: payment_currencies
            description: Array of payment token addresses.
          - name: payment_amounts
            description: Array of decimal(38,0).
          - name: payment_asset_types
            description: Array of asset type codes, bigint.
          - name: payment_beneficiaries
            description: Array of payment beneficiary addresses.
          - name: bronze_extracted_at
            description: Extraction timestamp inherited from bronze.
          - name: decoded_at
            description: Timestamp of the decode Lambda run.
          - name: dt
            description: Block date partition (YYYY-MM-DD).

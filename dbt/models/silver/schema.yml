version: 2

models:
  - name: dim_contracts
    description: >
      Unified contract dimension merging the official Decentraland registry
      (dcl_contracts) with the hand-curated contract list (contracts).
      One row per (chain_id, contract_address).
    columns:
      - name: chain_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 137]
                quote: false
      - name: contract_address
        data_tests:
          - not_null

  - name: dim_contracts_changes
    description: >
      One row per contract change between the latest and previous snapshots.
      Consumed by the pipeline notifier: rows present after a build trigger
      an INFO Slack notification. Empty means no changes.
    columns:
      - name: change_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["added", "removed", "renamed"]
      - name: chain_id
        data_tests:
          - not_null
      - name: contract_address
        data_tests:
          - not_null

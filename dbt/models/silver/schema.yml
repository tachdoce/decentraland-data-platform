version: 2

models:
  - name: dim_contracts
    description: >
      Curated contract dimension from the latest bronze.contracts snapshot
      (the hand-curated CSV, single source of truth). erc_type = -1 rows
      are excluded here; consumers never see them. One row per
      (chain_id, contract_address).
    columns:
      - name: chain_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 137]
                quote: false
      - name: contract_address
        data_tests:
          - not_null
      - name: dcl_contract
        data_tests:
          - not_null
      - name: erc_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 20, 721, 1155]
                quote: false

  - name: ethereum_currency_transfers
    description: >
      ERC-20 Transfer events decoded in SQL from bronze.ethereum_logs.
      Includes untracked payment tokens on purpose (future sales parsing).
      Grain: one row per (transaction_hash, log_index).
    columns:
      - name: transaction_hash
        description: Transaction hash.
        data_tests:
          - not_null
      - name: log_index
        description: Log position within the block.
        data_tests:
          - not_null
      - name: block_timestamp
        description: Block timestamp (UTC).
        data_tests:
          - not_null
      - name: token_address
        description: ERC-20 contract that emitted the Transfer, lowercase.
        data_tests:
          - not_null
      - name: from_address
        description: Sender address (decoded from topics[2]), lowercase.
        data_tests:
          - not_null
      - name: to_address
        description: Recipient address (decoded from topics[3]), lowercase.
        data_tests:
          - not_null
      - name: amount_raw
        description: Transfer amount in the token's smallest unit (uint256, valid below 2^96).
        data_tests:
          - not_null
      - name: dt
        description: Block date partition (YYYY-MM-DD).
        data_tests:
          - not_null

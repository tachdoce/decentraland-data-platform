version: 2

models:
  - name: dim_contracts
    description: >
      Curated contract dimension from the latest bronze.contracts snapshot
      (the hand-curated CSV, single source of truth). erc_type = -1 rows
      are excluded here; consumers never see them. One row per
      (chain_id, contract_address).
    columns:
      - name: chain_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 137]
                quote: false
      - name: contract_address
        data_tests:
          - not_null
      - name: dcl_contract
        data_tests:
          - not_null
      - name: erc_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 20, 721, 1155]
                quote: false

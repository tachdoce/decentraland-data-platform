version: 2

models:
  - name: dim_contracts
    description: >
      Curated contract dimension from the latest bronze.contracts snapshot
      (the hand-curated CSV, single source of truth). erc_type = -1 rows
      are excluded here; consumers never see them. One row per
      (chain_id, contract_address).
    columns:
      - name: chain_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 137]
                quote: false
      - name: contract_address
        data_tests:
          - not_null
      - name: dcl_contract
        data_tests:
          - not_null
      - name: erc_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 20, 721, 1155]
                quote: false

  - name: dim_erc20_tokens
    description: >
      Curated ERC-20 payment-token dimension from the latest
      bronze.erc20_tokens snapshot. One row per
      (chain_id, contract_address); fsym is NOT unique (GALA v1/v2).
    columns:
      - name: chain_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 137]
                quote: false
      - name: contract_address
        data_tests:
          - not_null
      - name: name
        data_tests:
          - not_null
      - name: fsym
        data_tests:
          - not_null
      - name: decimals
        data_tests:
          - not_null
      - name: fetch_price
        data_tests:
          - not_null
      - name: snapshot_dt
        data_tests:
          - not_null

  - name: token_prices
    description: >
      Daily USD price per currency symbol, deduped (latest extracted_at)
      and gap-filled: days without a quote carry the last known price
      forward up to var('price_fill_end_dt'). One row per
      (currency_symbol, dt); only dimension rows with fetch_price = TRUE
      are priced, which keeps symbols unique (GALA v1 excluded).
    columns:
      - name: currency_symbol
        data_tests:
          - not_null
      - name: price_usd
        data_tests:
          - not_null
      - name: dt
        data_tests:
          - not_null

  - name: nft_transfers
    description: >
      ERC-721/1155 transfers for curated contracts, deduplicated to the
      latest bronze extraction run per log. One row per transferred token
      position — a 1155 TransferBatch yields many rows per
      (chain_id, transaction_hash, log_index), so that key is NOT unique
      (see tests/assert_nft_transfers_single_run.sql). Incremental,
      partitioned by (chain_id, dt); runs advance at most
      nft_transfers_incremental_days (default 10) past the current max dt.
    columns:
      - name: transaction_hash
        data_tests:
          - not_null
      - name: log_index
        data_tests:
          - not_null
      - name: contract_address
        data_tests:
          - not_null
      - name: token_id
        data_tests:
          - not_null
      - name: quantity
        data_tests:
          - not_null
      - name: from_address
        data_tests:
          - not_null
      - name: to_address
        data_tests:
          - not_null
      - name: chain_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 137]
                quote: false
      - name: dt
        data_tests:
          - not_null

  - name: mana_transfers
    description: >
      MANA (ERC-20) Transfer events on Ethereum, deduplicated to the
      latest decode and bronze extraction run per log (dual criterion:
      decoded_at alone cannot separate bronze copies ingested by one
      decode run). One row per (chain_id, transaction_hash, log_index).
      amount_raw = 0 no-op transfers are kept; filtering belongs to
      gold. Incremental, partitioned by (chain_id, dt); runs advance at
      most mana_transfers_incremental_days (default 10) past max dt.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - transaction_hash
              - log_index
    columns:
      - name: transaction_hash
        data_tests:
          - not_null
      - name: log_index
        data_tests:
          - not_null
      - name: block_timestamp
        data_tests:
          - not_null
      - name: token_address
        data_tests:
          - not_null
      - name: from_address
        data_tests:
          - not_null
      - name: to_address
        data_tests:
          - not_null
      - name: amount_raw
        data_tests:
          - not_null
      - name: chain_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1]
                quote: false
      - name: dt
        data_tests:
          - not_null

  - name: sales
    description: >
      One row per token sold across the five Ethereum marketplaces
      (legacy auctions, marketplace v2, wyvern, seaport, marketplace
      trades). Grain: (chain_id, transaction_hash, log_index,
      nft_contract_address, token_id). Partitioned by (marketplace, dt);
      dedup by latest decoded_at per (dt, transaction_hash, log_index).
    columns:
      - name: transaction_hash
        data_tests:
          - not_null
      - name: log_index
        data_tests:
          - not_null
      - name: block_timestamp
        data_tests:
          - not_null
      - name: buyer
        data_tests:
          - not_null
      - name: seller
        data_tests:
          - not_null
      - name: nft_contract_address
        data_tests:
          - not_null
      - name: token_id
        data_tests:
          - not_null
      - name: quantity
        data_tests:
          - not_null
      - name: currency
        description: Payment token address; zero address = native ETH.
        data_tests:
          - not_null
      - name: total_amount_raw
        data_tests:
          - not_null
      - name: royalty_amount_raw
        description: >
          Raw royalty amount. NULL only on seaport sales without an
          identified seller.
      - name: bronze_extracted_at
      - name: decoded_at
      - name: silver_processed_at
      - name: chain_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1]
                quote: false
      - name: marketplace
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - ethereum_legacy_auctions
                  - ethereum_marketplace_v2
                  - ethereum_wyvern
                  - ethereum_seaport
                  - ethereum_marketplace_trades
      - name: dt
        data_tests:
          - not_null

# Builds the Evidence dashboard (reading gold/ from S3 via OIDC) and deploys
# it to GitHub Pages. No cron by design: runs only on manual dispatch or when
# a merge to main touches dashboard/.
name: deploy-dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["dashboard/**"]

permissions:
  contents: read
  pages: write
  id-token: write # OIDC token for both AWS AssumeRole and Pages deploy

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::683569194224:role/github-actions-dashboard
          aws-region: us-east-1

      - run: npm ci
      - run: npm run s3-secret
      - run: npm run sources
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
